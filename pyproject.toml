[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lfkit"
dynamic = ["version"]
description = "Luminosity functions and photometric corrections toolkit."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "astroquery",
  "numpy>=1.23",
  "scipy>=1.9",
  "kcorrect",
  "pyccl",
]

[project.optional-dependencies]

viz = [
  "matplotlib>=3.7",
  "cmasher>=1.8",
]

docs = [
  "sphinx<9",
  "sphinx-design",
  "sphinx-copybutton",
  "furo",
  "sphinx-multiversion",
  #"sphinxawesome-theme",
  "matplotlib>=3.7",
  "tox",
]

dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
  "tox>=4.22",
]

[tool.setuptools_scm]
version_file = "src/lfkit/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"lfkit" = [
  "data/**/*",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
include = ["src/**/*.py"]
exclude = ["src/lfkit/_version.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.tox]
requires = ["tox>=4.22"]
envlist = [
  "py312",
  "cov",
  "cov-strict",
  "docs",
  "do",
  "docs-releases",
]

[tool.tox.env_run_base.setenv]
PIP_CACHE_DIR = "{tox_root}/.cache/pip"

[tool.tox.env.py312]
description = "Run unit tests"
extras = ["dev"]
commands = [
  ["pytest", "-q"],
]

[tool.tox.env.cov]
description = "Coverage report for dev (does not fail)"
extras = ["dev"]
commands = [
  [
    "pytest",
    "-q",
    "--cov=lfkit",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=0",
  ],
]

[tool.tox.env.cov-strict]
description = "Coverage gate (fails if below fail_under)"
extras = ["dev"]
commands = [
  [
    "pytest",
    "-q",
    "--cov=lfkit",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
  ],
]

[tool.tox.env.docs]
description = "Build docs with Sphinx and doctest"
extras = ["docs", "viz"]
commands = [
  [
    "sphinx-apidoc",
    "-d", "2",
    "-o", "{tox_root}/docs/api",
    "{tox_root}/src/lfkit",
    "--separate",
    "--no-toc",
    "-f",
  ],
  [
    "sphinx-build",
    "-c", "{tox_root}/docs",
    "-b", "{posargs:html}",
    "{tox_root}/docs",
    "{tox_root}/docs/_build/{posargs:html}",
    "--fail-on-warning",
  ],
]

[tool.tox.env.do]
description = "Run doctests + html build and open local docs"
recreate = true
extras = ["docs", "viz"]
allowlist_externals = ["open", "rm"]
commands = [
  [
    "rm",
    "-rf",
    "{tox_root}/docs/_build/doctest",
    "{tox_root}/docs/_build/html",
  ],
  [
    "sphinx-apidoc",
    "-d", "2",
    "-o", "{tox_root}/docs/api",
    "{tox_root}/src/lfkit",
    "--separate",
    "--no-toc",
    "-f",
  ],
  [
    "sphinx-build",
    "-b", "doctest",
    "{tox_root}/docs",
    "{tox_root}/docs/_build/doctest",
    "--fail-on-warning",
  ],
  [
    "sphinx-build",
    "-b", "html",
    "{tox_root}/docs",
    "{tox_root}/docs/_build/html",
    "--fail-on-warning",
  ],
  ["open", "{tox_root}/docs/_build/html/index.html"],
]

[tool.tox.env.docs-releases]
description = "Build the documentation for lfkit releases using Sphinx"
extras = ["docs", "viz"]
allowlist_externals = ["cp"]
commands = [
  [
    "sphinx-apidoc",
    "-d", "2",
    "-o", "{tox_root}/docs/api",
    "{tox_root}/src/lfkit",
    "--separate",
    "-f",
  ],
  [
    "sphinx-multiversion",
    "-c", "{tox_root}/docs",
    "{tox_root}/docs",
    "{tox_root}/docs/_build/html",
    "--fail-on-warning",
  ],
  [
    "cp",
    "{tox_root}/docs/_templates/pages_redirect.html",
    "{tox_root}/docs/_build/html/index.html",
  ],
]
